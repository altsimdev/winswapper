name: build

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # The project asks for $(DefaultPlatformToolset) and SDK "10.0" rather than
      # pinning a version, so it picks up whatever Visual Studio the runner image
      # ships. Printing them makes it obvious what a given run actually used.
      - name: Report toolset
        continue-on-error: true   # diagnostics only; -getProperty needs MSBuild 17.8+
        run: |
          msbuild winswapper.vcxproj `
            /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 `
            -getProperty:PlatformToolset -getProperty:WindowsTargetPlatformVersion

      - name: Build
        run: msbuild winswapper.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /m

      # winswapper.exe is a GUI-subsystem binary, so PowerShell does not wait for it
      # on its own and $LASTEXITCODE would be whatever came before. Piping to Out-Null
      # forces the wait.
      - name: Smoke test
        run: |
          $exe = "build\x64\${{ matrix.configuration }}\winswapper.exe"
          if (-not (Test-Path $exe)) { throw "no binary at $exe" }

          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }

          # --selftest exits 0 when every check ran, 3 when it passed everything it
          # could but skipped the window-move tests for want of a second display -
          # which is always the case on a runner. 1 is a real failure and 2 a usage
          # error, and both must fail the step. The rotation arithmetic is checked
          # either way, so this is worth running here.
          & $exe --selftest | Out-Null
          $rc = $LASTEXITCODE

          # The binary cannot write to this step's console, so its results only land
          # in the log. Print it, or a failure would say "exited 1" and nothing about
          # which check broke.
          $log = Join-Path $env:LOCALAPPDATA "WinSwapper\winswapper.log"
          if (Test-Path $log) { Get-Content $log }

          if ($rc -eq 3) { Write-Host "note: window-move tests skipped (single-display runner)" }
          elseif ($rc -ne 0) { throw "--selftest exited $rc" }

          $v = (Get-Item $exe).VersionInfo
          Write-Host "built $($v.FileDescription) $($v.FileVersion), $((Get-Item $exe).Length) bytes"

          # GitHub's pwsh wrapper appends "exit $LASTEXITCODE", so the tolerated 3
          # from --selftest would fail the step despite being handled above.
          exit 0

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: winswapper-x64-${{ matrix.configuration }}
          path: |
            build/x64/${{ matrix.configuration }}/winswapper.exe
            build/x64/${{ matrix.configuration }}/winswapper.pdb
          if-no-files-found: error

  # Only for tag pushes. Packages the Release binary with its documentation and
  # attaches the zip, plus a checksum, to a GitHub release for that tag.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    permissions:
      contents: write   # needed to create the release; the build job stays read-only

    steps:
      - uses: actions/checkout@v4

      # First, so a missing CHANGELOG.md entry stops the release before anything is
      # published. The script is the same one that previews notes locally.
      - name: Release notes from CHANGELOG.md
        run: |
          $notes = & ./.github/release-notes.ps1 -Tag "${{ github.ref_name }}" -Repo "${{ github.repository }}"
          [IO.File]::WriteAllText((Join-Path $PWD "notes.md"), $notes)
          Get-Content notes.md

      - uses: actions/download-artifact@v4
        with:
          name: winswapper-x64-Release
          path: artifact

      - name: Assemble the zip
        id: pkg
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "winswapper-$tag-x64.zip"

          # Only the exe ships; the pdb stays a CI artifact for crash dumps.
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item artifact\winswapper.exe pkg\
          Copy-Item README.md, LICENSE.txt pkg\

          $v = (Get-Item pkg\winswapper.exe).VersionInfo.FileVersion
          Write-Host "packaging winswapper.exe $v as $zip"

          Compress-Archive -Path pkg\* -DestinationPath $zip -Force

          # Set-Content would end the line with CRLF, which "sha256sum -c" rejects
          # outright, so the checksum file is written with an explicit LF.
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path $PWD "$zip.sha256"), "$hash  $zip`n")

          Get-Content "$zip.sha256"
          "zip=$zip" >> $env:GITHUB_OUTPUT

      # gh is preinstalled on the runner, so this needs no third-party action.
      # Tolerating an existing release keeps a re-run from failing outright.
      #
      # The notes come from CHANGELOG.md rather than --generate-notes, which builds
      # them from merged pull requests - and with everything pushed straight to
      # master there are none, so it produced nothing but a compare link.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "${{ steps.pkg.outputs.zip }}"

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag exists; replacing its assets and notes"
            gh release upload $tag $zip "$zip.sha256" --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with $LASTEXITCODE" }
            gh release edit $tag --notes-file notes.md
          } else {
            gh release create $tag $zip "$zip.sha256" `
              --title "WinSwapper $tag" --notes-file notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "gh failed with $LASTEXITCODE" }
